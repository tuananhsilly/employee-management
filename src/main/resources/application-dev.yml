# Local development (default profile): a PostgreSQL on this machine.
# Override the connection with DB_URL, DB_USERNAME and DB_PASSWORD; the fallbacks
# are PostgreSQL's out-of-the-box local defaults, not real credentials.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_management}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

# Development-only values, so the app runs out of the box. Never used in prod.
app:
  security:
    jwt:
      secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789}
    initial-admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin12345}

logging:
  level:
    com.example.employeemanagement: DEBUG
