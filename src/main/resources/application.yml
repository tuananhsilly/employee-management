# Settings shared by every profile. Environment-specific settings live in
# application-dev.yml (the default) and application-prod.yml.
spring:
  application:
    name: employee-management
  profiles:
    default: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  cache:
    cache-names: employee-count
    caffeine:
      spec: expireAfterWrite=1m

server:
  servlet:
    session:
      # Flash messages use the session; keep its id in a cookie, never in redirect URLs.
      tracking-modes: cookie

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  info:
    env:
      enabled: true

# Served by /actuator/info.
info:
  app:
    name: ${spring.application.name}
    description: Employee Management System - Spring Boot learning mini project
