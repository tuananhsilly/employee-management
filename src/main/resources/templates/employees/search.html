<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: pageHead('Tìm kiếm nhân viên')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main>
	<h1>Tìm kiếm nhân viên</h1>
	<form class="search-form" method="get" th:action="@{/employees/search}">
		<label>Họ tên
			<input type="text" name="name" th:value="${name}" placeholder="Nhập tên cần tìm">
		</label>
		<label>Phòng ban
			<select name="departmentId">
				<option value="">-- Tất cả --</option>
				<option th:each="department : ${departments}" th:value="${department.id}" th:selected="${department.id == departmentId}" th:text="${department.name}">IT</option>
			</select>
		</label>
		<button type="submit">Tìm</button>
	</form>
	<div th:replace="~{fragments/layout :: employeeTable}"></div>
	<nav th:replace="~{fragments/layout :: pager}"></nav>
</main>
</body>
</html>
