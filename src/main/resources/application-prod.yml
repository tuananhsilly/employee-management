# Production: the connection, the JWT secret and the initial Admin come only from
# environment variables, so no secret is committed. A missing DB_* or JWT_SECRET
# stops startup.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    # Empty when unset, so no Admin is created with a placeholder name; see InitialAdminRunner.
    initial-admin:
      username: ${ADMIN_USERNAME:}
      password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.example.employeemanagement: INFO
